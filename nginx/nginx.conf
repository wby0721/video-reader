# ============================================================
# Video Reader Nginx 站点配置（docker 内使用，被替换为 conf.d/default.conf）
# 功能：80→443 跳转 + ACME 验证 + 静态前端 + /api 反代（SSE）
# 域名：jasonsweb.xyz（部署时如需改域名，改 server_name 与证书路径）
# ============================================================

# ---- 80 端口：ACME 验证 + 强制跳转 HTTPS ----
server {
    listen 80;
    server_name jasonsweb.xyz www.jasonsweb.xyz;

    # Let's Encrypt 域名验证（certbot --webroot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- 443 端口：静态前端 + API 反代 ----
server {
    listen 443 ssl;
    server_name jasonsweb.xyz www.jasonsweb.xyz;

    ssl_certificate     /etc/letsencrypt/live/jasonsweb.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jasonsweb.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # 前端单页路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器（含 SSE 进度推送）
    # 注意：尾斜杠会把 /api 前缀剥掉（后端路由无 /api，如 /user/login）
    location /api/ {
        proxy_pass http://backend:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键：关闭缓冲 + 长超时，否则进度事件不实时
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # 分片上传单请求 5MB，留足余量
        client_max_body_size 200m;
    }
}
